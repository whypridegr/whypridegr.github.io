name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy step to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # Public PostHog project key (phc_…) — ships in the browser bundle by
          # design, so it's safe to keep here. The .env is gitignored, so CI
          # needs it explicitly or analytics no-ops in production.
          PUBLIC_POSTHOG_KEY: phc_wV9p6p5hWiPceda3phYdBoRVhZms8diiLmNMtnkzdyN4
          PUBLIC_POSTHOG_HOST: https://eu.i.posthog.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
